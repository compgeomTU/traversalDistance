[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traversal-distance"
version = "0.2.0"
description = "Traversal-distance computations for embedded straight-line graphs"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["numpy>=1.23"]

[project.scripts]
traversal-distances = "traversal_distance.cli:main"

[tool.setuptools.packages.find]
include = ["traversal_distance*"]
